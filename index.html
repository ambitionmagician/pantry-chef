<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174735">
<meta name="description" content="Find simple recipes using the ingredients already in your pantry.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'">
<link rel="manifest" href="./manifest.json">

<title>Pantry Chef — cook from what you already have</title>
<style>
:root{color-scheme:light;--ink:#183b30;--pine:#174735;--muted:#52685f;--line:#d4dfd2;--cream:#faf8ef;--gold:#ffce82}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--pine);color:white;padding:2.2rem max(5vw,calc((100vw - 74rem)/2))}
.eyebrow{font-size:.75rem;font-weight:750;letter-spacing:.15em;text-transform:uppercase}
header .eyebrow{color:var(--gold)}
h1,h2,h3{font-family:Georgia,serif;line-height:1.15;margin:.35rem 0 .65rem}
h1{font-size:clamp(2.8rem,8vw,5rem);letter-spacing:-.055em}
h2{font-size:2rem}h3{font-size:1.45rem}
header p{margin:.4rem 0 1rem}
.status,.badge{display:inline-block;padding:.2rem .65rem;border-radius:2rem;font-size:.8rem;font-weight:650}
.status{background:#285944;color:#f8f4df}
main{width:min(92%,74rem);margin:1.6rem auto 4rem;display:grid;gap:1.6rem;align-items:start}
.panel,article{background:white;border:1px solid var(--line);border-radius:1rem;padding:1.15rem}
.panel p,.sub{color:var(--muted);margin:.4rem 0 1rem}
input,button{font:inherit}
input[type=search],input[type=text]{width:100%;min-width:0;border:1px solid #9eafa4;border-radius:.55rem;padding:.65rem;background:white;color:var(--ink)}
button{border:0;border-radius:.55rem;padding:.6rem .9rem;cursor:pointer;background:var(--pine);color:white;font-weight:650}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid #bc6714;outline-offset:2px}
label.caption,.caption{display:block;font-size:.85rem;font-weight:700;margin:.8rem 0 .25rem}
#items{max-height:19rem;overflow:auto;margin:.7rem 0;padding:.2rem .35rem;border-block:1px solid var(--line);overscroll-behavior:contain}
.choice{display:flex;align-items:center;gap:.65rem;min-height:2.65rem;cursor:pointer;overflow-wrap:anywhere}
input[type=checkbox]{accent-color:var(--pine);width:1.15rem;height:1.15rem;flex:none}
.row{display:flex;align-items:center;gap:.5rem}
.row button{flex:none}
#notice{font-size:.85rem;color:var(--muted);margin-top:.6rem}
#cards{display:grid;gap:.8rem}
article{padding:1.15rem 1.25rem}
.badge{background:#fff0d7;color:#74430f}
.ready{background:#dff1df;color:#20552d}
.meta{color:var(--muted);font-size:.9rem}
.shop{border-left:.2rem solid var(--gold);padding-left:.65rem;margin:.8rem 0;overflow-wrap:anywhere}
summary{cursor:pointer;color:var(--pine);font-weight:700;padding:.45rem 0}
.controls{display:flex;align-items:center;gap:.7rem;margin:.65rem 0}
.controls button{width:2.5rem;padding:.4rem}
.controls span{min-width:5.5rem;text-align:center}
h4{margin:1rem 0 .25rem}ul,ol{padding-left:1.35rem;margin:.3rem 0}
li+li{margin-top:.25rem}
.empty{color:var(--muted);font-size:.9rem;padding:.5rem 0}
#more{margin-top:1rem}
@media(min-width:48rem){main{grid-template-columns:minmax(16rem,.85fr) minmax(0,1.5fr)}.panel{position:sticky;top:.75rem}#items{max-height:min(40vh,25rem)}}
</style>
</head>
<body>
<header>
<div class="eyebrow">The everyday kitchen</div>
<h1>Pantry Chef</h1>
<p>Cook from what you already have.</p>
<span class="status" id="offline" role="status">Local recipe book</span>
</header>
<main>
<section class="panel" aria-labelledby="pantryTitle">
<div class="eyebrow">01 / Take stock</div>
<h2 id="pantryTitle">Your pantry</h2>
<p>Check what you have. Tap water is assumed; everything else counts.</p>
<label class="caption" for="search">Find an ingredient</label>
<div class="row">
<input type="search" id="search" placeholder="Try “rice”" autocomplete="off">
<button type="button" id="clearSearch" aria-label="Clear search" disabled>✕</button>
</div>
<div class="caption" id="count" aria-live="polite"></div>
<div id="items" role="group" aria-label="Pantry ingredients"></div>
<form id="addForm">
<label class="caption" for="extra">Add an ingredient</label>
<div class="row"><input type="text" id="extra" required maxlength="80" placeholder="Ingredient name"><button>Add</button></div>
</form>
<div id="notice" role="status"></div>
</section>
<section aria-labelledby="matchTitle">
<div class="eyebrow">02 / Make something</div>
<h2 id="matchTitle">Your best matches</h2>
<p class="sub" id="summary" role="status" aria-live="polite"></p>
<div id="cards"></div>
<button id="more" type="button">Show more recipes</button>
</section>
</main>
<script>
"use strict";
const book=[
["Tomato toast",8,2,"2:slices:bread|2::tomatoes|1:tsp:olive oil","Toast the bread until crisp.|Chop the tomatoes, toss with oil and spoon over the toast."],

["Garlicky mushroom toast",15,2,"2:cups:mushrooms|2:slices:bread|1:clove:garlic|1:tbsp:butter","Slice mushrooms and sauté in butter until golden. Stir in minced garlic and cook one minute.|Toast bread and pile the mushrooms on top."],

["Rustic potato soup",30,2,"2::potatoes|1::onions|2:cups:vegetable broth|1:tbsp:butter","Soften chopped onion in butter. Add diced potatoes and broth.|Simmer until potatoes are soft, about 18 minutes. Mash in the pot to your preferred texture."]
].map(([name,time,base,raw,method])=>({name,time,base,ingredients:raw.split("|").map(s=>{const [q,u,n]=s.split(":");return {q:Number(q),u,n}}),steps:method.split("|")}));

const $=id=>document.getElementById(id);
const node=(tag,text,cls)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el};
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
const baseNames=new Set(book.flatMap(r=>r.ingredients.map(i=>i.n)));
const aliases=new Map(Object.entries({
  "egg":"eggs","eggs":"eggs",
  "tomato":"tomatoes","tomatoes":"tomatoes",
  "potato":"potatoes","potatoes":"potatoes",
  "onion":"onions","onions":"onions",
  "carrot":"carrots","carrots":"carrots",
  "banana":"bananas","bananas":"bananas",
  "apple":"apples","apples":"apples",
  "lemon":"lemons","lemons":"lemons",
  "cucumber":"cucumbers","cucumbers":"cucumbers",
  "mushroom":"mushrooms","mushrooms":"mushrooms",
  "tortilla":"tortillas","tortillas":"tortillas",
  "garlic":"garlic","garlic clove":"garlic","garlic cloves":"garlic","clove garlic":"garlic","cloves garlic":"garlic",
  "oats":"rolled oats","rolled oats":"rolled oats","oat":"rolled oats","oatmeal":"rolled oats",
  "yogurt":"plain yogurt","yoghurt":"plain yogurt","plain yogurt":"plain yogurt","greek yogurt":"plain yogurt",
  "milk":"milk",
  "cheese":"cheddar","cheddar":"cheddar","cheddar cheese":"cheddar",
  "rice":"cooked rice","cooked rice":"cooked rice",
  "pasta":"pasta","noodles":"pasta","spaghetti":"pasta",
  "bread":"bread","toast":"bread",
  "peanut butter":"peanut butter","peanutbutter":"peanut butter",
  "white beans":"canned white beans","canned white beans":"canned white beans","cannellini beans":"canned white beans","cannellini":"canned white beans",
  "black beans":"canned black beans","canned black beans":"canned black beans",
  "chickpeas":"canned chickpeas","canned chickpeas":"canned chickpeas","chickpea":"canned chickpeas","garbanzo beans":"canned chickpeas","garbanzo":"canned chickpeas",
  "tuna":"canned tuna","canned tuna":"canned tuna",
  "lentils":"red lentils","red lentils":"red lentils","red lentil":"red lentils","canned lentils":"canned lentils","canned lentil":"canned lentils","brown lentils":"canned lentils",
  "vegetable broth":"vegetable broth","broth":"vegetable broth","stock":"vegetable broth","vegetable stock":"vegetable broth","veggie broth":"vegetable broth","veggie stock":"vegetable broth",
  "soy sauce":"soy sauce","soysauce":"soy sauce",
  "corn":"canned corn","canned corn":"canned corn","sweetcorn":"canned corn",
  "peas":"frozen peas","frozen peas":"frozen peas","green peas":"frozen peas",
  "couscous":"instant couscous","instant couscous":"instant couscous",
  "coconut milk":"coconut milk","coconutmilk":"coconut milk",
  "salsa":"salsa",
  "curry powder":"curry powder",
  "cumin":"cumin","cumin powder":"cumin",
  "cinnamon":"cinnamon","cinnamon powder":"cinnamon",
  "oregano":"oregano","oregano flakes":"oregano",
  "flour":"flour","all purpose flour":"flour",
  "sugar":"sugar",
  "raisins":"raisins",
  "berries":"berries","mixed berries":"berries","strawberries":"berries","blueberries":"berries","raspberries":"berries",
  "spinach":"spinach","baby spinach":"spinach",
  "broccoli":"broccoli",
  "cabbage":"cabbage",
  "butter":"butter",
  "olive oil":"olive oil","oil":"olive oil","cooking oil":"olive oil"
}));
const canonical=s=>aliases.get(norm(s))||norm(s);
const key="pantry-chef-stock-v1";
const yieldKey="pantry-chef-yields-v1";
let custom=new Set(),stock=new Set(),limit=6;
const yields=new Map(),expanded=new Set();
try{
 const saved=JSON.parse(localStorage.getItem(key)||"{}");
 const clean=a=>Array.isArray(a)?a.filter(s=>typeof s==="string"&&s.trim()&&s.length<=80).map(canonical):[];
 custom=new Set(clean(saved.custom));
 stock=new Set(clean(saved.stock).filter(n=>custom.has(n)||baseNames.has(n)));
}catch{$("notice").textContent="Saved pantry unavailable. You can still use this session."}
try{
 const y=JSON.parse(localStorage.getItem(yieldKey)||"{}");
 if(y&&typeof y==="object")Object.entries(y).forEach(([k,v])=>{if(Number.isFinite(v)&&v>=1&&v<=24)yields.set(k,v)});
}catch{}

function save(msg=""){
 try{localStorage.setItem(key,JSON.stringify({custom:[...custom],stock:[...stock]}));$("notice").textContent=msg}
 catch{$("notice").textContent="Storage unavailable: pantry changes will last for this session only."}
}
function saveYields(){
 try{const o={};yields.forEach((v,k)=>o[k]=v);localStorage.setItem(yieldKey,JSON.stringify(o))}
 catch{}
}
function count(){$("count").textContent=`${stock.size} ingredient${stock.size===1?"":"s"} on hand`}
function slug(n){return n.replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function pantry(){
 count();
 const list=$("items");
 list.replaceChildren();
 const query=norm($("search").value);
 const items=[...new Set([...baseNames,...custom])].sort();
 let shown=0;
 for(const n of items){
  if(!n.includes(query)&&!(query&&canonical(query)===n))continue;
  shown++;
  const id="ing-"+slug(n);
  const label=node("label",undefined,"choice");
  const box=node("input");
  box.type="checkbox";box.checked=stock.has(n);box.id=id;
  box.onchange=()=>{if(box.checked)stock.add(n);else stock.delete(n);save();count();matches()};
  label.htmlFor=id;
  label.append(box,document.createTextNode(n));
  list.append(label);
 }
 if(!shown)list.append(node("p","No results. Add your ingredient below.","empty"));
}
$("search").oninput=()=>{$("clearSearch").disabled=!$("search").value;pantry()};
$("clearSearch").onclick=()=>{$("search").value="";$("search").focus();$("clearSearch").disabled=true;pantry()};
$("addForm").onsubmit=e=>{
 e.preventDefault();
 const raw=$("extra").value;
 const n=canonical(raw);
 if(!n){$("extra").focus();return}
 if(!baseNames.has(n))custom.add(n);
 stock.add(n);
 save(`On hand: ${n}.`);
 $("extra").value="";$("search").value="";$("clearSearch").disabled=true;
 pantry();matches();
};

function frac(q){
 const sign=q<0?"-":"";
 q=Math.abs(q);
 const whole=Math.floor(q);
 const rem=Number((q-whole).toFixed(6));
 const map=[[1/8,"⅛"],[1/4,"¼"],[3/8,"⅜"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[5/8,"⅝"],[3/4,"¾"],[7/8,"⅞"]];
 let piece="";
 for(const [v,s] of map){if(Math.abs(rem-v)<0.001){piece=s;break}}
 if(!piece&&rem>0)return sign+String(q);
 if(whole===0)return sign+piece;
 if(piece==="")return sign+whole;
 return sign+whole+piece;
}
function pluralUnit(u,q){
 if(!u)return "";
 if(Math.abs(q-1)<0.001)return u.replace(/s$/,"");
 if(u.endsWith("s"))return u;
 const irregular={cup:"cups",clove:"cloves",slice:"slices",piece:"pieces"};
 return irregular[u]??u;
}
function amount(i,scale){
 const q=i.q*scale;
 const u=pluralUnit(i.u,q);
 return [frac(q),u,i.n].filter(Boolean).join(" ");
}

function card(r,missing){
 const el=node("article"),h=node("h3",r.name);
 h.style.scrollMarginTop="1rem";
 const badge=node("span",missing.length?`${missing.length} missing`:"Ready to cook",missing.length?"badge":"badge ready");
 el.append(badge,h);
 const meta=node("div",`${r.time} min`,"meta");
 const controls=node("div",undefined,"controls");
 const minus=node("button","−"),plus=node("button","+"),value=node("span");
 minus.setAttribute("aria-label","Decrease servings");plus.setAttribute("aria-label","Increase servings");
 minus.setAttribute("type","button");plus.setAttribute("type","button");
 value.setAttribute("aria-live","polite");
 controls.append(minus,value,plus);
 const shop=node("p",undefined,"shop");
 const d=node("details"),s=node("summary","Ingredients & method");
 d.open=expanded.has(r.name);
 const ul=node("ul"),ol=node("ol");r.steps.forEach(step=>ol.append(node("li",step)));
 d.append(s,node("h4","Ingredients"),ul,node("h4","Method"),ol);el.append(meta,controls,shop,d);
 function update(delta){
  const servings=Math.min(24,Math.max(1,(yields.get(r.name)??r.base)+delta));
  yields.set(r.name,servings);
  saveYields();
  const scale=servings/r.base;
  value.textContent=`${servings} serving${servings===1?"":"s"}`;
  minus.disabled=servings===1;plus.disabled=servings===24;
  shop.replaceChildren(node("strong","Shopping list: "),document.createTextNode(missing.length?missing.map(i=>amount(i,scale)).join(" · "):"Nothing to buy."));
  ul.replaceChildren(...r.ingredients.map(i=>node("li",`${amount(i,scale)} — ${stock.has(i.n)?"on hand":"to buy"}`)));
  d.ontoggle=()=>{if(d.open)expanded.add(r.name);else expanded.delete(r.name)};
 }
 minus.onclick=()=>update(-1);plus.onclick=()=>update(1);update(0);return el;
}
function matches(){
 const rows=book.map(r=>({r,m:r.ingredients.filter(i=>!stock.has(i.n))})).sort((a,b)=>a.m.length-b.m.length||a.r.time-b.r.time||a.r.name.localeCompare(b.r.name));
 const ready=rows.filter(x=>!x.m.length).length;
 $("summary").textContent=`${ready} ready to cook · Showing ${Math.min(limit,rows.length)} of ${rows.length}, fewest missing first.`;
 $("cards").replaceChildren(...rows.slice(0,limit).map(x=>card(x.r,x.m)));
 $("more").hidden=limit>=rows.length;
}
$("more").onclick=()=>{const first=limit;limit+=6;matches();const title=$("cards").children[first]?.querySelector("h3");if(title){title.tabIndex=-1;title.focus()}};
pantry();matches();
if("serviceWorker" in navigator && window.isSecureContext){
 navigator.serviceWorker.register("./sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{$("offline").textContent="Offline ready"}).catch(()=>{$("offline").textContent="Offline setup unavailable"});
}else $("offline").textContent="For offline installation, serve on HTTPS or localhost";
</script>
